<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Interview Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one column app, sticky tab bar (Study / Revise / Quiz), cards stacked inside. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#16212b; --muted:#5b6b7a; --line:#dde3e9;
  --accent:#0b6bcb; --accent-ink:#ffffff; --accent-soft:#e3effc;
  --good:#1b7f4b; --good-soft:#e1f3e9; --warn:#9a6a00; --warn-soft:#fbf0d3; --bad:#b4281f; --bad-soft:#fbe4e1;
  --code-bg:#0f1b26; --code-ink:#d6e3ef;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151c; --surface:#16202a; --ink:#e6edf3; --muted:#93a3b3; --line:#27343f;
    --accent:#5aa9f5; --accent-ink:#06121e; --accent-soft:#16304a;
    --good:#58c98a; --good-soft:#143324; --warn:#e3b341; --warn-soft:#3a2f10; --bad:#f0827a; --bad-soft:#40201d;
    --code-bg:#0a1118; --code-ink:#cfe0ee; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#16202a; --ink:#e6edf3; --muted:#93a3b3; --line:#27343f;
  --accent:#5aa9f5; --accent-ink:#06121e; --accent-soft:#16304a;
  --good:#58c98a; --good-soft:#143324; --warn:#e3b341; --warn-soft:#3a2f10; --bad:#f0827a; --bad-soft:#40201d;
  --code-bg:#0a1118; --code-ink:#cfe0ee; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body)}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h1{font:700 28px/1.15 var(--f-display);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 12px;display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav button{flex:1;font:500 15px var(--f-body);padding:10px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
h2{font:600 13px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;margin-bottom:10px;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card>summary::-webkit-details-marker{display:none}
.card>summary .t{font:600 17px var(--f-display);flex:1;min-width:160px}
.card>summary::after{content:"+";font:500 20px var(--f-mono);color:var(--muted)}
.card[open]>summary::after{content:"\2212"}
.body{padding:2px 16px 16px;border-top:1px solid var(--line)}
.body h3{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.body p{margin:0}
pre{background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:12px 14px;margin:6px 0 0;overflow-x:auto;font:400 13px/1.5 var(--f-mono)}
.pill{font:500 12px var(--f-body);padding:3px 9px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.new{background:var(--warn-soft);color:var(--warn)}
.ok{background:var(--good-soft);color:var(--good)}
.weak{background:var(--bad-soft);color:var(--bad)}
.due{background:var(--accent-soft);color:var(--accent)}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{font:500 15px var(--f-body);padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stage{padding:20px 18px}
.stage .q{font:600 21px/1.3 var(--f-display);margin:8px 0 16px;text-wrap:balance}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.opt{display:block;width:100%;text-align:left;font:400 15px/1.45 var(--f-body);padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.expl{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--accent-soft);font-size:15px}
.ans{margin-top:14px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.how{font-size:14px;color:var(--muted);margin:0 0 14px}
code.inline{font:400 13px var(--f-mono);background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
textarea{display:block;width:100%;min-height:76px;resize:vertical;font:400 15px/1.5 var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:8px 0 10px}
textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
select{font:500 15px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.note{padding:14px 16px}
.note b{font:600 15px var(--f-display)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hello Interview Revision</h1>
    <div class="sub" id="today"></div>
    <div class="sub row"><span id="sync"></span><button class="btn" id="tokbtn" style="padding:4px 10px;font-size:13px">Set token</button></div>
  </header>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" id="tab-study" aria-selected="true" data-tab="study">Study</button>
    <button role="tab" id="tab-revise" aria-selected="false" data-tab="revise">Revise</button>
    <button role="tab" id="tab-quiz" aria-selected="false" data-tab="quiz">Quiz</button>
  </nav>
  <main id="view"></main>
</div>

<script>
/* Content (concepts, questions, generated quizzes) comes from content.json, built from content/ by
   scripts/build.mjs. Review state is cached in localStorage and synced to the Worker API (/api/*),
   one card or log row per request. Writes go through an outbox so nothing is lost while offline. */
var INTERVALS = [1,3,7,14,30];
function localDate(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
var TODAY = localDate();

var CONTENT = null, CONCEPTS = [], BYID = {};
var K = {token:"hi_token", cards:"hi_cards", log:"hi_log", outbox:"hi_outbox", chapter:"hi_chapter"};
var state = {
  tab:"study", chapter:null, cards:{}, log:[], loaded:false, sync:"loading",
  rev:null, quiz:{started:false}, note:"", noteMsg:""
};

function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function tok(){ try{ return localStorage.getItem(K.token)||""; }catch(e){ return ""; } }
function uid(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12); }

function $(s,r){return (r||document).querySelector(s);}
function el(tag,attrs,kids){
  var n=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    if(k==="class")n.className=attrs[k]; else if(k==="text")n.textContent=attrs[k];
    else if(k.indexOf("on")===0)n.addEventListener(k.slice(2),attrs[k]); else n.setAttribute(k,attrs[k]);});}
  (kids||[]).forEach(function(c){ if(c==null)return; n.appendChild(typeof c==="string"?document.createTextNode(c):c);});
  return n;
}
function addDays(d,n){var t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function uniq(a){ return a.filter(function(x,i){ return a.indexOf(x)===i; }); }
function titleOf(id){ return BYID[id]?BYID[id].title:id; }

function chapterInfo(){ return CONTENT.chapters.filter(function(c){return c.id===state.chapter;})[0]||CONTENT.chapters[0]; }
function chapterConcepts(){ return CONCEPTS.filter(function(c){return c.chapter===state.chapter;}); }
function defaultCard(c){ return {stage:0,next:c.added,status:"new",learned:c.added}; }
function isDue(id){ return state.cards[id].next<=TODAY; }

/* ---------- Sync ---------- */
var outbox = lsGet(K.outbox,[]);
var flushing = false;

function api(method,path,body){
  var ctl = window.AbortController?new AbortController():null;
  var timer = ctl?setTimeout(function(){ctl.abort();},10000):null;
  return fetch(path,{method:method,signal:ctl?ctl.signal:undefined,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok()},
      body:body?JSON.stringify(body):undefined})
    .then(function(r){
      clearTimeout(timer);
      if(!r.ok){ var e=new Error("HTTP "+r.status); e.status=r.status; throw e; }
      return r.json();
    },function(e){ clearTimeout(timer); e.status=0; throw e; });
}
function setSync(t){
  state.sync=t; var n=$("#sync"); if(!n)return;
  var waiting = outbox.length?" ("+outbox.length+" change"+(outbox.length>1?"s":"")+" waiting)":"";
  n.textContent=({loading:"Loading...",ok:"Synced",saving:"Saving...",
    pending:"Not synced"+waiting, offline:"Offline: saved on this device"+waiting, auth:"Token needed"+waiting})[t];
}
function cache(){ lsSet(K.cards,state.cards); lsSet(K.log,state.log.slice(-200)); }
function queue(op){
  if(op.kind==="card") outbox=outbox.filter(function(o){ return !(o.kind==="card"&&o.id===op.id); });
  outbox.push(op); lsSet(K.outbox,outbox); flush();
}
function opRequest(o){
  if(o.kind==="card") return ["PUT","/api/cards/"+encodeURIComponent(o.id),o.body];
  if(o.kind==="log") return ["POST","/api/quiz-log",o.body];
  return ["POST","/api/notes",o.body];
}
// Sends queued writes one at a time, oldest first. Stops at the first network/auth failure and retries later.
function flush(){
  if(flushing||!state.loaded) return Promise.resolve();
  if(!outbox.length){ if(state.sync==="saving"||state.sync==="pending")setSync("ok"); return Promise.resolve(); }
  flushing=true; setSync("saving");
  function step(){
    if(!outbox.length){ flushing=false; setSync("ok"); return Promise.resolve(); }
    var r=opRequest(outbox[0]);
    return api(r[0],r[1],r[2]).then(function(){ outbox.shift(); lsSet(K.outbox,outbox); return step(); });
  }
  return step().catch(function(e){
    flushing=false;
    if(e.status===400||e.status===413){ // the server will never accept this one; drop it so the queue keeps moving
      console.warn("Dropped write the API rejected",outbox.shift(),e); lsSet(K.outbox,outbox); return flush();
    }
    setSync(e.status===401?"auth":e.status===0?"offline":"pending");
  });
}
function saveCard(id){ cache(); queue({kind:"card",id:id,body:Object.assign({},state.cards[id])}); }

// Server state wins, then any queued local writes are applied on top (they are newer).
function load(){
  if(!state.loaded) setSync("loading");
  return api("GET","/api/state").then(function(d){
    CONCEPTS.forEach(function(c){ state.cards[c.id]=Object.assign(defaultCard(c),d.cards[c.id]||{}); });
    var seen={}; d.log.forEach(function(r){seen[r.id]=1;});
    outbox.forEach(function(o){ if(o.kind==="card"&&state.cards[o.id])Object.assign(state.cards[o.id],o.body); });
    state.log=d.log.concat(outbox.filter(function(o){return o.kind==="log"&&!seen[o.body.id];}).map(function(o){return o.body;}));
    cache(); state.loaded=true; setSync("ok");
    if(state.rev&&!state.rev.practice&&state.rev.done===0) state.rev=null; // rebuild an untouched round from fresh dates
    return flush();
  }).catch(function(e){
    state.loaded=true; // use the cached state; writes queue until the API is reachable
    setSync(e.status===401?"auth":"offline");
  });
}

/* ---------- Shared bits ---------- */
function statusPill(id){
  var s=state.cards[id];
  if(s.status==="weak")return el("span",{class:"pill weak",text:"Weak"});
  if(s.status==="ok")return el("span",{class:"pill ok",text:"Stage "+s.stage});
  return el("span",{class:"pill new",text:"New"});
}
function duePill(id){
  var s=state.cards[id], due=isDue(id);
  return el("span",{class:"pill "+(due?"due":"meta"),text:(due?"Due now":"Next "+s.next)});
}
function groupByTopic(){
  return chapterInfo().topics.map(function(t){
    return {topic:t,items:chapterConcepts().filter(function(c){return c.topic===t;})};
  }).filter(function(g){return g.items.length;});
}
function nextReview(){ return chapterConcepts().map(function(c){return state.cards[c.id].next;}).sort()[0]||"-"; }

/* ---------- Study ---------- */
function renderStudy(root){
  var list=chapterConcepts();
  if(CONTENT.chapters.length>1){
    var sel=el("select",{"aria-label":"Chapter",onchange:function(){
      state.chapter=sel.value; lsSet(K.chapter,state.chapter); state.rev=null; state.quiz={started:false}; render(); }});
    CONTENT.chapters.forEach(function(ch){ var o=el("option",{value:ch.id,text:ch.title}); if(ch.id===state.chapter)o.selected=true; sel.appendChild(o); });
    root.appendChild(el("div",{class:"row",style:"margin-bottom:14px"},[sel]));
  }
  root.appendChild(el("div",{class:"summary"},[
    el("div",{class:"tile"},[el("b",{text:String(list.length)}),el("span",{text:"concepts in "+chapterInfo().title})]),
    el("div",{class:"tile"},[el("b",{text:String(list.filter(function(c){return isDue(c.id);}).length)}),el("span",{text:"due today"})]),
    el("div",{class:"tile"},[el("b",{text:String(list.filter(function(c){return state.cards[c.id].status==="weak";}).length)}),el("span",{text:"marked weak"})]),
    el("div",{class:"tile"},[el("b",{text:nextReview()}),el("span",{text:"next review"})])
  ]));

  var ta=el("textarea",{"aria-label":"Quick note",maxlength:"5000",placeholder:"Something you just learned. Rough notes are fine."});
  ta.value=state.note; ta.addEventListener("input",function(){ state.note=ta.value; });
  root.appendChild(el("div",{class:"card note"},[
    el("b",{text:"Quick note"}),
    el("p",{class:"meta",style:"margin:2px 0 0",text:"Saved to your inbox. The daily Claude run turns notes into concept cards and quiz questions."}),
    ta,
    el("div",{class:"row"},[
      el("button",{class:"btn primary",text:"Save note",onclick:function(){
        var t=state.note.trim(); if(!t)return;
        queue({kind:"note",body:{id:uid(),text:t}});
        state.note=""; state.noteMsg="Saved. It will show up as a concept after the next daily run."; render();
      }}),
      state.noteMsg?el("span",{class:"meta",text:state.noteMsg}):null
    ])
  ]));

  root.appendChild(el("p",{class:"how",style:"margin-top:16px",text:"Each card holds key points, trade-offs, an example and a self-test question. Reviews come at +1, +3, +7, +14 and +30 days."}));
  groupByTopic().forEach(function(g){
    root.appendChild(el("h2",{text:g.topic+" ("+g.items.length+")"}));
    g.items.forEach(function(c){
      var s=state.cards[c.id];
      var d=el("details",{class:"card"});
      d.appendChild(el("summary",{},[el("span",{class:"t",text:c.title}),statusPill(c.id),duePill(c.id)]));
      var b=el("div",{class:"body"});
      b.appendChild(el("h3",{text:"Key points"}));
      var ul=el("ul",{style:"margin:0;padding-left:20px"});
      c.points.forEach(function(p){ul.appendChild(el("li",{text:p}));});
      b.appendChild(ul);
      if(c.code){ b.appendChild(el("h3",{text:"Example"})); b.appendChild(el("pre",{text:c.code})); }
      if(c.trade){ b.appendChild(el("h3",{text:"Trade-offs"})); b.appendChild(el("p",{text:c.trade})); }
      b.appendChild(el("h3",{text:"Self-test"}));
      b.appendChild(el("p",{text:c.test}));
      b.appendChild(el("p",{class:"meta",style:"margin-top:12px",text:"Learned "+s.learned+" · Stage "+s.stage+" · Next review "+s.next}));
      d.appendChild(b);
      root.appendChild(d);
    });
  });
}

/* ---------- Revise ---------- */
// A normal round holds only cards due today, weak ones first. A practice round holds every card
// and does not change the schedule, so extra rounds can't push cards up the intervals early.
function buildRevise(practice){
  var list=chapterConcepts().filter(function(c){ return practice||isDue(c.id); });
  list.sort(function(a,b){
    var A=state.cards[a.id],B=state.cards[b.id];
    var wa=A.status==="weak"?0:1, wb=B.status==="weak"?0:1;
    if(wa!==wb)return wa-wb;
    return A.next<B.next?-1:A.next>B.next?1:0;
  });
  state.rev={order:list.map(function(c){return c.id;}),i:0,shown:false,done:0,good:0,bad:[],practice:!!practice};
}
function renderRevise(root){
  if(!state.rev)buildRevise(false);
  var r=state.rev, total=r.order.length;
  root.appendChild(el("p",{class:"how",text:r.practice
    ?"Practice round: every card, and your ratings don't change the schedule."
    :"Cards due today. Answer in your head, reveal, then rate yourself. Got it moves the card to the next interval. Struggled resets it to +1 day and marks it weak."}));
  if(r.i>=total){
    var dueLeft=chapterConcepts().filter(function(c){return isDue(c.id);}).length;
    var box=el("div",{class:"card stage"});
    if(total){
      box.appendChild(el("div",{class:"q",text:r.practice?"Practice round finished":"Round finished"}));
      box.appendChild(el("p",{text:r.good+" recalled, "+r.bad.length+" struggled."}));
      if(r.bad.length)box.appendChild(el("p",{class:"meta",text:"Struggled: "+r.bad.map(titleOf).join(", ")}));
    }else{
      box.appendChild(el("div",{class:"q",text:"Nothing due today"}));
    }
    if(!dueLeft)box.appendChild(el("p",{class:"meta",text:"All caught up. Next review: "+nextReview()+"."}));
    box.appendChild(el("div",{class:"row",style:"margin-top:14px"},[
      dueLeft?el("button",{class:"btn primary",text:"Review "+dueLeft+" due card"+(dueLeft>1?"s":""),onclick:function(){buildRevise(false);render();}}):null,
      el("button",{class:"btn"+(dueLeft?"":" primary"),text:"Practice anyway",onclick:function(){buildRevise(true);render();}})
    ]));
    root.appendChild(box);
    return;
  }
  root.appendChild(el("div",{class:"progress"},[el("i",{style:"width:"+Math.round(r.done/total*100)+"%"})]));
  var c=BYID[r.order[r.i]];
  var card=el("div",{class:"card stage"});
  card.appendChild(el("div",{class:"row"},[el("span",{class:"meta",text:(r.i+1)+" of "+total}),statusPill(c.id),el("span",{class:"meta",text:c.topic})]));
  card.appendChild(el("div",{class:"q",text:c.test}));
  if(!r.shown){
    card.appendChild(el("button",{class:"btn primary",text:"Show answer",onclick:function(){state.rev.shown=true;render();}}));
  }else{
    card.appendChild(el("div",{class:"ans"},[el("b",{text:c.title}),el("p",{style:"margin:6px 0 0",text:c.answer})]));
    var ul=el("ul",{style:"margin:12px 0 0;padding-left:20px"});
    c.points.forEach(function(p){ul.appendChild(el("li",{text:p}));});
    card.appendChild(ul);
    var good=el("button",{class:"btn good",text:"Got it",onclick:function(){rate(c.id,true);}});
    var bad=el("button",{class:"btn bad",text:"Struggled",onclick:function(){rate(c.id,false);}});
    if(!state.loaded){ good.disabled=true; bad.disabled=true; }
    card.appendChild(el("div",{class:"row",style:"margin-top:16px"},[good,bad,state.loaded?null:el("span",{class:"meta",text:"Loading your progress..."})]));
  }
  root.appendChild(card);
}
function markWeak(id){ var s=state.cards[id]; s.stage=0; s.next=addDays(TODAY,1); s.status="weak"; }
function rate(id,good){
  if(!state.loaded)return;
  var r=state.rev;
  if(!r.practice){
    var s=state.cards[id];
    if(good){
      s.stage=Math.min(s.stage+1,INTERVALS.length);
      s.next=addDays(TODAY,INTERVALS[s.stage-1]);
      s.status="ok";
    }else markWeak(id);
    saveCard(id);
  }
  if(good)r.good++; else r.bad.push(id);
  r.i++; r.done++; r.shown=false;
  render();
}

/* ---------- Quiz ---------- */
function todaysQuiz(){ return (CONTENT.quizzes||[]).filter(function(z){return z.date===TODAY;})[0]||null; }
// Five questions, at most one per concept where possible: weak concepts first, then due, then the rest.
function pickQuestions(n){
  var all=[];
  chapterConcepts().forEach(function(c){ c.questions.forEach(function(q){ all.push(Object.assign({concept:c.id},q)); }); });
  var rank=function(q){ var s=state.cards[q.concept]; return s.status==="weak"?0:isDue(q.concept)?1:2; };
  all=shuffle(all).sort(function(a,b){return rank(a)-rank(b);});
  var picked=[],used={};
  all.forEach(function(q){ if(picked.length<n&&!used[q.concept]){picked.push(q);used[q.concept]=1;} });
  all.forEach(function(q){ if(picked.length<n&&picked.indexOf(q)<0)picked.push(q); });
  return picked;
}
function startQuiz(source){
  var src = source==="today"?todaysQuiz().questions.filter(function(q){return BYID[q.concept];}):pickQuestions(5);
  var qs=src.map(function(q){
    var idx=shuffle(q.options.map(function(_,i){return i;}));
    return {concept:q.concept,topic:BYID[q.concept].topic,question:q.question,explanation:q.explanation,
            options:idx.map(function(i){return q.options[i];}),correct:idx.indexOf(q.correct)};
  });
  state.quiz={qs:qs,i:0,picked:null,score:0,miss:[],finished:false,started:true,source:source};
}
function renderQuiz(root){
  var z=state.quiz;
  if(!z.started){
    var tq=todaysQuiz(), bankSize=chapterConcepts().reduce(function(n,c){return n+c.questions.length;},0);
    root.appendChild(el("p",{class:"how",text:"Pick an answer and you see the explanation straight away. A wrong answer marks that concept weak and brings it back tomorrow."}));
    root.appendChild(el("div",{class:"card stage"},[
      el("div",{class:"q",text:"Quiz me on "+chapterInfo().title}),
      el("p",{class:"meta",text:tq?"Today's quiz was generated from your weak and due concepts.":"Five questions from your concepts, weak and due ones first."}),
      el("div",{class:"row",style:"margin-top:14px"},[
        tq?el("button",{class:"btn primary",text:"Start today's quiz ("+tq.questions.length+")",onclick:function(){startQuiz("today");render();}}):null,
        bankSize?el("button",{class:"btn"+(tq?"":" primary"),text:tq?"Quick quiz instead":"Start quiz",onclick:function(){startQuiz("bank");render();}})
                :el("span",{class:"meta",text:"No questions in this chapter yet."})
      ])
    ]));
    return;
  }
  if(z.finished){ renderResult(root); return; }
  var q=z.qs[z.i];
  root.appendChild(el("div",{class:"progress"},[el("i",{style:"width:"+Math.round(z.i/z.qs.length*100)+"%"})]));
  var card=el("div",{class:"card stage"});
  card.appendChild(el("div",{class:"row"},[el("span",{class:"meta",text:"Question "+(z.i+1)+" of "+z.qs.length}),el("span",{class:"meta",text:q.topic})]));
  card.appendChild(el("div",{class:"q",text:q.question}));
  q.options.forEach(function(t,i){
    var cls="opt";
    if(z.picked!==null){ if(i===q.correct)cls+=" right"; else if(i===z.picked)cls+=" wrong"; }
    var b=el("button",{class:cls,text:t,onclick:function(){ if(z.picked!==null)return; z.picked=i; if(i===q.correct)z.score++; else z.miss.push(q.concept); render(); }});
    if(z.picked!==null)b.setAttribute("disabled","");
    card.appendChild(b);
  });
  if(z.picked!==null){
    card.appendChild(el("div",{class:"expl",text:(z.picked===q.correct?"Correct. ":"Not quite. ")+q.explanation}));
    card.appendChild(el("div",{class:"row",style:"margin-top:14px"},[
      el("button",{class:"btn primary",text:z.i===z.qs.length-1?"See result":"Next question",onclick:function(){
        if(z.i===z.qs.length-1){z.finished=true;logQuiz();} else {z.i++; z.picked=null;} render(); }})
    ]));
  }
  root.appendChild(card);
}
function logQuiz(){
  var z=state.quiz, weak=uniq(z.miss);
  var row={id:uid(),date:TODAY,score:z.score,n:z.qs.length,topics:uniq(z.qs.map(function(q){return q.topic;})),weak:weak};
  state.log.push(row); cache();
  queue({kind:"log",body:row});
  weak.forEach(function(id){ markWeak(id); saveCard(id); });
}
function renderResult(root){
  var z=state.quiz, n=z.qs.length, weak=uniq(z.miss);
  var card=el("div",{class:"card stage"});
  card.appendChild(el("div",{class:"q",text:"You scored "+z.score+" out of "+n}));
  card.appendChild(el("p",{text:weak.length?"Marked weak, back tomorrow: "+weak.map(titleOf).join(", ")+".":"No weak spots this round."}));
  card.appendChild(el("div",{class:"row",style:"margin-top:14px"},[
    el("button",{class:"btn primary",text:"New quiz",onclick:function(){state.quiz={started:false};render();}})
  ]));
  root.appendChild(card);
  root.appendChild(el("h2",{text:"Quiz log"}));
  root.appendChild(el("div",{class:"scroll"},[el("table",{},[
    el("thead",{},[el("tr",{},[el("th",{text:"Date"}),el("th",{text:"Score"}),el("th",{text:"Topics"}),el("th",{text:"Weak spots"})])]),
    el("tbody",{},state.log.slice(-10).reverse().map(function(r){return el("tr",{},[
      el("td",{text:r.date}),el("td",{text:r.score+"/"+r.n}),el("td",{text:r.topics.join("; ")}),el("td",{text:r.weak.map(titleOf).join("; ")||"none"})]);}))
  ])]));
}

/* ---------- Shell ---------- */
function render(){
  TODAY=localDate();
  if(!CONTENT)return;
  $("#today").textContent=chapterInfo().title+" · "+TODAY;
  var root=$("#view"); root.textContent="";
  if(state.tab==="study")renderStudy(root);
  else if(state.tab==="revise")renderRevise(root);
  else renderQuiz(root);
  ["study","revise","quiz"].forEach(function(t){ $("#tab-"+t).setAttribute("aria-selected",String(state.tab===t)); });
  setSync(state.sync);
}
document.querySelectorAll("nav button").forEach(function(b){
  b.addEventListener("click",function(){ state.tab=b.getAttribute("data-tab"); location.hash=state.tab; render(); window.scrollTo(0,0); });
});
function fromHash(){ var h=location.hash.replace("#",""); if(h==="study"||h==="revise"||h==="quiz"){state.tab=h;} }
window.addEventListener("hashchange",function(){fromHash();render();});
$("#tokbtn").addEventListener("click",function(){
  var t=prompt("Access token (the APP_TOKEN secret on the Worker)");
  if(t===null)return;
  try{localStorage.setItem(K.token,t.trim());}catch(e){}
  load().then(render);
});
window.addEventListener("online",function(){ flush(); });
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"&&CONTENT)flush().then(load).then(render); });
setInterval(function(){ if(outbox.length)flush(); },60000);

fromHash();
fetch("content.json",{cache:"no-cache"}).then(function(r){ if(!r.ok)throw new Error(r.status); return r.json(); }).then(function(c){
  CONTENT=c; CONCEPTS=c.concepts; CONCEPTS.forEach(function(x){BYID[x.id]=x;});
  var saved=lsGet(K.chapter,null);
  state.chapter=c.chapters.some(function(ch){return ch.id===saved;})?saved:c.chapters[0].id;
  var cached=lsGet(K.cards,{});
  CONCEPTS.forEach(function(x){ state.cards[x.id]=Object.assign(defaultCard(x),cached[x.id]||{}); });
  outbox.forEach(function(o){ if(o.kind==="card"&&state.cards[o.id])Object.assign(state.cards[o.id],o.body); });
  state.log=lsGet(K.log,[]);
  render();
  load().then(render);
}).catch(function(){
  $("#view").textContent="Could not load content.json. Run npm run build, or npm run dev for local testing.";
});
</script>
